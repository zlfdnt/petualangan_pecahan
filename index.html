<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petualangan Pecahan - Kelas VII</title>
<style>
:root{--p:#7c4dcc;--d:#2d1b4e;--o:#ff8a3d;--t:#1fb5a8;--bg:#f3ecff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:linear-gradient(135deg,#efe4ff,#dff7f3 55%,#fff0e0);color:var(--d);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--d);color:#fff;position:sticky;top:0;z-index:5}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:linear-gradient(90deg,var(--o),#ff5e7e);color:#fff;font-weight:700}
button:disabled{background:#bbb;cursor:not-allowed}button.s{background:var(--p)}button.g{background:#fff;color:var(--d);border:2px solid var(--p)}
main{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 24px #7c4dcc22;margin-bottom:16px}
.hero{text-align:center;padding:30px 10px}.hero h1{font-size:2.2rem;margin:.2em 0;background:linear-gradient(90deg,var(--p),var(--o));-webkit-background-clip:text;color:transparent}
.fl{position:fixed;font-size:2rem;opacity:.5;animation:fl 7s ease-in-out infinite;pointer-events:none}@keyframes fl{50%{transform:translateY(-25px) rotate(15deg)}}
input,select,textarea{width:100%;padding:11px;border:2px solid #d8c8f5;border-radius:12px;font:inherit;margin:6px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#e6dcfa;color:var(--d)}.tabs .on{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.st{border-radius:18px;padding:18px;color:#fff;text-align:center;cursor:pointer;transition:.2s}.st:hover{transform:translateY(-4px)}.st.lk{filter:grayscale(1);opacity:.55;cursor:not-allowed}.st b{display:block;font-size:2.2rem}
.f{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;line-height:1.1}.f i{font-style:normal;border-bottom:2px solid currentColor;padding:0 3px}
.pizza{width:150px;height:150px;border-radius:50%;margin:auto;border:4px solid #c0702a}
.opt{display:block;width:100%;text-align:left;background:#f6f0ff;color:var(--d);margin:6px 0;border:2px solid #d8c8f5}.opt.ok{background:#c8f7d4;border-color:#2cb55a}.opt.no{background:#ffd3d3;border-color:#e44}
.steps li{margin:6px 0}.bx{background:#fff7e8;border-left:6px solid var(--o);padding:10px 14px;border-radius:10px;margin:10px 0}
.g100{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:280px;margin:10px auto}.g100 u{aspect-ratio:1;background:#eadcff;border-radius:3px;transition:.15s}.g100 u.on{background:var(--o)}
.pop{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}.pop>div{background:#fff;border-radius:24px;padding:28px;max-width:360px;text-align:center;animation:bn 1s infinite alternate}@keyframes bn{to{transform:translateY(-12px)}}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}th{background:#f0e7ff}.bar{height:10px;background:#eadcff;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--o))}
</style></head><body>
<div class=fl style="top:12%;left:4%">🍕</div><div class=fl style="top:60%;right:5%;animation-delay:2s">🧭</div><div class=fl style="top:80%;left:10%;animation-delay:4s">⭐</div>
<header><b>🍕 Petualangan Pecahan</b><span id=hr></span></header><main id=app></main>
<script>
const API='https://script.google.com/macros/s/AKfycbyJUOiUVOHu6EOzqg7rfmSMctul1cqaACxaRLPCNNlShUfgjFrHmTrbBMwbEDbgDwNY/exec';
const $=s=>document.querySelector(s),app=$('#app');
let U=null,S={done:0,skor:0},G={};
async function api(o){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)});return await r.json()}catch(e){return{ok:false}}}
const log=(aksi,detail='')=>api({a:'log',...U,aksi,detail}),save=()=>api({a:'save',...U,done:S.done,skor:S.skor});
const F=(a,b)=>`<span class=f><i>${a}</i><b>${b}</b></span>`;
const KLS=['VII-A','VII-B','VII-C','VII-D'];
const ST=[['Mengenal Pecahan','🍕','#7c4dcc,#b388ff'],['Jenis-jenis Pecahan','🎁','#ff8a3d,#ff5e7e'],['Hubungan Antar Pecahan','🔗','#1fb5a8,#6ee7b7'],['Latihan','📝','#3b82f6,#7dd3fc'],['Petualangan','🗺️','#e11d74,#ff8a3d'],['Refleksi & Lanjut','🏆','#f5b301,#ffd86b']];
function login(){U=null;$('#hr').innerHTML='';app.innerHTML=`<div class="card hero"><div style="font-size:4rem">🍕🧭🎒</div><h1>Petualangan Pecahan</h1><p>Media Pembelajaran Matematika Kelas VII</p>
<div class=tabs style="justify-content:center"><button class=on id=t1 onclick=tab(1)>👧 Siswa</button><button id=t2 onclick=tab(2)>👩‍🏫 Guru</button></div>
<div id=fs style="max-width:340px;margin:auto;text-align:left"><label>Nama Lengkap</label><input id=nm><label>Kelas</label><select id=kl>${KLS.map(k=>`<option>${k}</option>`).join('')}</select><button style="width:100%" onclick=enter()>🚀 Mulai Petualangan</button></div>
<div id=fg style="max-width:340px;margin:auto;text-align:left;display:none"><label>Password Guru</label><input id=pw type=password><button class=s style="width:100%" onclick=teacher()>Masuk Dashboard</button></div></div>`}
function tab(n){$('#fs').style.display=n==1?'':'none';$('#fg').style.display=n==2?'':'none';$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':''}
async function enter(){const nama=$('#nm').value.trim().replace(/\s+/g,' ');if(nama.length<3)return alert('Isi nama lengkapmu dulu ya');U={nama,kelas:$('#kl').value};
const r=await api({a:'load',...U});S={done:+r.done||0,skor:+r.skor||0};log('Login',r.found?'lanjut':'baru');home(S.done>0&&S.done<6)}
function bar(){$('#hr').innerHTML=`${U.nama} (${U.kelas}) ⭐${S.skor} <button class=g style="padding:5px 12px" onclick=out()>Keluar</button>`}
async function out(){await log('Logout');await save();login()}
function home(resume){bar();app.innerHTML=`<div class="card hero" style="background:linear-gradient(120deg,#7c4dcc,#e11d74 60%,#ff8a3d);color:#fff"><h1 style="background:none;-webkit-background-clip:initial;color:#fff">Halo, ${U.nama.split(' ')[0]}! 👋</h1><p>Selesaikan setiap tahap berurutan untuk membuka tahap berikutnya.</p><div class=bar><i style="width:${S.done/6*100}%"></i></div><small>${S.done}/6 tahap selesai</small></div>
<div class=grid>${ST.map((s,i)=>`<div class="st ${i>S.done?'lk':''}" style="background:linear-gradient(135deg,${s[2]})" onclick="${i>S.done?`alert('Selesaikan tahap sebelumnya dulu ya 🔒')`:`open_(${i})`}"><b>${i>S.done?'🔒':s[1]}</b>Tahap ${i+1}<br>${s[0]}${i<S.done?'<br>✅':''}</div>`).join('')}</div>`;
if(resume){const n=Math.min(S.done,5);app.insertAdjacentHTML('beforeend',`<div class=pop id=pp><div><div style="font-size:3rem">🧭</div><h2>Selamat datang kembali!</h2><p>Kamu terakhir sampai di<br><b>Tahap ${n+1}: ${ST[n][0]}</b>.<br>Yuk lanjutkan dari sana!</p><button onclick="$('#pp').remove();open_(${n})">Lanjutkan ▶</button></div></div>`)}}
function open_(i){G={i,seen:new Set(),ans:{}};log('Buka tahap',ST[i][0]);bar();app.innerHTML=`<button class=g onclick=home()>← Peta</button><div class=card><h2>${ST[i][1]} Tahap ${i+1}: ${ST[i][0]}</h2><div id=bd></div></div><div style="text-align:right"><button id=nx disabled onclick=fin()>Selesai & Lanjut ▶</button></div>`;
const done=i<S.done;[s0,s1,s2,s3,s4,s5][i]();if(done)gate(1)}
function gate(f){$('#nx').disabled=!f}
function fin(){const i=G.i;if(S.done==i)S.done=i+1;log('Selesai tahap',ST[i][0]);save();i<5?home():home()}
/* Tahap 1 */
function s0(){$('#bd').innerHTML=`<div class=bx>🎯 <b>Tujuan:</b> memahami pecahan sebagai bagian dari keseluruhan, mengenal berbagai bentuknya, dan mengubah antarbentuknya dalam konteks nyata.</div>
<p>Pecahan adalah bilangan ${F('a','b')} dengan <b>a = pembilang</b> (bagian yang diambil), <b>b = penyebut</b> (banyak bagian sama besar), b ≠ 0. Garis pecahan = pembagian.</p>
<p>🔎 <b>Eksplorasi:</b> geser dan lihat pizza berubah. Coba 5 kali!</p><div class=pizza id=pz></div><p style="text-align:center;font-size:1.6rem" id=fr></p>
Penyebut: <input type=range id=pb min=2 max=12 value=4 oninput=pz()>Pembilang: <input type=range id=pa min=1 max=12 value=1 oninput=pz()>
<div class=bx>💬 Mengapa pecahan penting? Untuk membagi makanan, mengukur, diskon, dan hasil pengukuran.</div>`;G.n=0;pz()}
function pz(){const b=+$('#pb').value,a=Math.min(+$('#pa').value,b);$('#pa').max=b;$('#pz').style.background=`conic-gradient(#ff8a3d 0 ${a/b*100}%,#ffe3b8 0)`;$('#fr').innerHTML=F(a,b)+` = ${(a/b).toFixed(2).replace('.',',')}`;if(++G.n>=6)gate(1)}
/* Tahap 2 */
const JN=[['Biasa','🍕',`Satu loyang otak-otak dipotong 8 sama besar. Rina makan 3 potong → ${F(3,8)}`,['Hitung banyak bagian sama besar → penyebut','Hitung bagian yang diambil → pembilang','Tulis pembilang di atas, penyebut di bawah']],
['Campuran','🥧',`Dita membeli 2 kotak kue utuh dan ${F(3,4)} kotak lagi → 2${F(3,4)} = ${F(11,4)}`,['Pisahkan bagian utuh dan bagian pecahan','Ubah ke biasa: utuh × penyebut + pembilang','2×4+3 = 11, penyebut tetap 4']],
['Perseratus','💯',`40 dari 100 siswa ikut olahraga → ${F(40,100)} = ${F(2,5)}`,['Bagi keseluruhan menjadi 100 bagian','Tulis bagian yang dimaksud sebagai a/100','Sederhanakan dengan faktor persekutuan terbesar']],
['Persen','%',`Tas Rp200.000 diskon 25%: ${F(25,100)}=${F(1,4)} × 200.000 = 50.000 → bayar Rp150.000`,['Ubah persen menjadi per 100','Sederhanakan pecahannya','Kalikan dengan nilai keseluruhan']]];
function s1(){$('#bd').innerHTML=`<p>Klik tombol untuk mengumpulkan jenis pecahan!</p><button id=gb onclick=gj()>🎁 Kumpulkan Jenis-jenis Pecahan</button><div id=jj></div>`}
function gj(){$('#gb').remove();$('#jj').innerHTML=`<div class=tabs>${JN.map((j,i)=>`<button id=j${i} onclick=jo(${i})>${j[1]} ${j[0]}</button>`).join('')}</div><div id=jc class=bx>Pilih satu jenis. Buka keempatnya untuk lanjut.</div>`}
function jo(i){const j=JN[i];G.seen.add(i);log('Buka jenis pecahan',j[0]);$('#j'+i).className='on';$('#jc').innerHTML=`<h3>${j[1]} Pecahan ${j[0]}</h3><ol class=steps>${j[3].map(s=>`<li>${s}</li>`).join('')}</ol><div class=bx>📌 <b>Contoh:</b> ${j[2]}</div>`;if(G.seen.size==4)gate(1)}
/* Tahap 3: animasi hubungan */
const HB=[[1,2,'0,5',50],[1,4,'0,25',25],[3,4,'0,75',75],[1,5,'0,2',20]];
function s2(){$('#bd').innerHTML=`<p>🎬 <b>Video animasi:</b> pilih pecahan, tekan Putar, lihat bagaimana pecahan, desimal, dan persen ternyata satu nilai yang sama. Putar minimal 3 pecahan.</p><div class=tabs>${HB.map((h,i)=>`<button id=h${i} onclick=hp(${i})>▶ ${h[0]}/${h[1]}</button>`).join('')}</div>
<div class=g100 id=gg>${'<u></u>'.repeat(100)}</div><div class=bx id=cp style="text-align:center;min-height:56px">Pilih pecahan di atas.</div>`}
function hp(i){const h=HB[i],c=$('#cp'),u=[...document.querySelectorAll('#gg u')];u.forEach(x=>x.className='');G.seen.add(i);log('Putar animasi',h[0]+'/'+h[1]);
c.innerHTML=`① Bagi 100 kotak menjadi ${h[1]} bagian sama besar; ambil ${h[0]} bagian...`;
setTimeout(()=>{u.forEach((x,k)=>setTimeout(()=>{if(k<h[3])x.className='on'},k*18));c.innerHTML=`② ${F(h[0],h[1])} = ${F(h[3],100)} (kalikan pembilang & penyebut agar penyebut 100)`},2000);
setTimeout(()=>c.innerHTML=`③ ${h[0]} : ${h[1]} = <b>${h[2]}</b> (desimal)`,5200);
setTimeout(()=>{c.innerHTML=`④ ${h[2]} × 100 = <b>${h[3]}%</b><br>${F(h[0],h[1])} = ${h[2]} = ${h[3]}%`;if(G.seen.size>=3)gate(1)},7600)}
/* Kuis umum */
const LT=[['Ibu memotong kue 8 bagian, Rina makan 3. Pecahan bagian Rina?',['3/8','8/3','5/8','3/5'],0],['Bentuk campuran dari 11/4?',['2 3/4','3 2/4','2 1/4','1 3/4'],0],['0,75 sama dengan...',['7,5%','75%','0,75%','750%'],1],['Diskon 25% untuk tas Rp200.000 adalah...',['Rp25.000','Rp50.000','Rp75.000','Rp150.000'],1],['Pecahan yang senilai 1/2 adalah...',['2/6','3/6','4/6','2/5'],1]];
const GM=[['🏝️ Pulau Pizza','Pizza dipotong 10 sama besar, 4 sudah dimakan. Bagian yang dimakan dalam persen?',['4%','40%','60%','14%'],1],['🌋 Gunung Desimal','3/5 dalam bentuk desimal adalah...',['0,35','0,6','0,53','3,5'],1],['🏴‍☠️ Kapal Bajak Laut','Baterai ponsel 45%. Pecahan paling sederhananya?',['45/100','9/20','4/5','9/10'],1],['🐉 Gua Naga','Mana yang paling kecil: 0,6; 1/2; 55%?',['0,6','1/2','55%','Sama'],1],['💎 Harta Karun','Sepatu Rp150.000 diskon 20%. Harga yang dibayar?',['Rp120.000','Rp130.000','Rp30.000','Rp100.000'],0]];
function quiz(L,tahap,retry){G.k=0;G.L=L;G.t=tahap;G.r=retry;G.ok=0;qn()}
function qn(){const q=G.L[G.k],game=G.r;$('#bd').innerHTML=`<div class=bar><i style="width:${G.k/G.L.length*100}%"></i></div><h3>${game?q[0]+'<br>':''}Soal ${G.k+1}/${G.L.length}</h3><p>${game?q[1]:q[0]}</p>${q[game?2:1].map((o,i)=>`<button class=opt onclick=pk(${i},this)>${o}</button>`).join('')}<div id=fb></div>`}
function pk(i,b){const q=G.L[G.k],game=G.r,op=q[game?2:1],c=q[game?3:2],ok=i==c;[...document.querySelectorAll('.opt')].forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');
api({a:'ans',...U,tahap:G.t,soal:q[game?1:0],jawab:op[i],benar:ok?'Ya':'Tidak'});log('Jawab '+G.t,(ok?'benar':'salah'));
if(ok){S.skor+=10;G.ok++}$('#fb').innerHTML=`<p>${ok?'🎉 Benar! +10 poin':'❌ Belum tepat. Jawaban: <b>'+op[c]+'</b>'}</p><button onclick=nq()>${G.k+1<G.L.length?'Lanjut ▶':'Lihat Hasil'}</button>`}
function nq(){if(++G.k<G.L.length)return qn();$('#bd').innerHTML=`<div style="text-align:center"><div style="font-size:4rem">${G.ok>=G.L.length*.6?'🏆':'💪'}</div><h2>Benar ${G.ok} dari ${G.L.length}</h2><p>Skor total ⭐${S.skor}</p></div>`;gate(1)}
function s3(){quiz(LT,'Latihan',0)}
function s4(){quiz(GM,'Petualangan',1)}
/* Tahap 6 */
function s5(){$('#bd').innerHTML=`<h3>🪞 Refleksi</h3><p>Tuliskan hal baru yang kamu pelajari tentang pecahan hari ini:</p><textarea id=rf rows=4 oninput="gate(this.value.trim().length>=15)"></textarea><button class=s onclick=sr()>📤 Kirim Refleksi</button><div id=rs></div>
<div class=bx>🚀 <b>Petualangan berikutnya:</b> Operasi Hitung Pecahan (penjumlahan & pengurangan) — segera hadir!</div>`}
function sr(){const v=$('#rf').value.trim();if(v.length<15)return alert('Tulis minimal 15 huruf ya');api({a:'ans',...U,tahap:'Refleksi',soal:'Hal baru yang dipelajari',jawab:v,benar:'-'});$('#rs').innerHTML='✅ Refleksi tersimpan! Tekan Selesai.';gate(1)}
/* Guru */
async function teacher(){const r=await api({a:'teacher',pass:$('#pw').value});if(!r.ok)return alert('Password salah / server belum tersambung');G={D:r,k:KLS[0],pw:$('#pw').value};$('#hr').innerHTML='Guru <button class=g style="padding:5px 12px" onclick=login()>Keluar</button>';dash()}
function dash(){const{D,k}=G,P=D.prog.filter(x=>x[2]==k);app.innerHTML=`<div class=card><h2>📊 Dashboard Guru</h2><div class=tabs>${KLS.map(c=>`<button class="${c==k?'on':''}" onclick="G.k='${c}';G.s=0;dash()">${c}</button>`).join('')}<button class=g onclick=teacher2()>🔄 Muat Ulang</button></div>
<p>${P.length} siswa mulai · rata-rata skor ${P.length?Math.round(P.reduce((a,x)=>a+x[4],0)/P.length):0}</p>
<table><tr><th>Nama</th><th>Progres</th><th>Skor</th><th>Terakhir</th><th></th></tr>${P.map(x=>`<tr><td>${x[1]}</td><td style="width:140px"><div class=bar><i style="width:${x[3]/6*100}%"></i></div>${x[3]}/6</td><td>${x[4]}</td><td>${new Date(x[5]).toLocaleString('id-ID')}</td><td><button class=s style="padding:4px 10px" onclick="G.s='${x[1].replace(/'/g,'')}';dash()">Detail</button></td></tr>`).join('')||'<tr><td colspan=5>Belum ada data</td></tr>'}</table></div>${G.s?det():''}`}
function det(){const n=G.s,A=G.D.ans.filter(x=>x[1]==n&&x[2]==G.k),L=G.D.log.filter(x=>x[1]==n&&x[2]==G.k).reverse();
return`<div class=card><h3>📝 Jawaban: ${n}</h3><table><tr><th>Tahap</th><th>Soal</th><th>Jawaban</th><th>Benar</th></tr>${A.map(x=>`<tr><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]}</td></tr>`).join('')}</table></div><div class=card><h3>🕒 Log Aktivitas</h3><table>${L.slice(0,80).map(x=>`<tr><td>${new Date(x[0]).toLocaleString('id-ID')}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</table></div>`}
async function teacher2(){const r=await api({a:'teacher',pass:G.pw||$('#pw')?.value});if(r.ok)G.D=r;dash()}
login();
</script></body></html>
