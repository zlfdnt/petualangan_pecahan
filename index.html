function ld(a,b,D){let r=a,L=[],N=[],e=2,nn=2,dg='';const c=()=>'①②③④⑤⑥⑦⑧⑨⑩'[nn++],pad=(s,k)=>{let t='';for(let p=0;p<=D;p++){const x=p-(k-s.length+1);t+=x>=0&&x<s.length?s[x]:' ';if(p==0)t+=' '}return t},sp=(x,k)=>`<span class=rv data-o=${k}>${x}</span>`,nt=(k,t)=>N.push(`<div class=rv data-o=${k}>${t}</div>`);let qh=sp('0,',1);

for(let k=1;k<=D;k++){const cur=r*10,d=Math.floor(cur/b),pr=d*b,rm=cur-pr,w=String(cur).length;dg+=d;qh+=sp(d,e);
nt(e,`<b>${c()}</b> ${cur} : ${b} = ${d} (karena ${b} × ${d} = ${pr}). Tulis <b>${d}</b> di hasil.`);
L.push(sp(pad(String(pr),k),e+1));nt(e+1,`<b>${c()}</b> Kalikan: ${b} × ${d} = ${pr}. Tulis ${pr} di bawah ${cur}.`);
L.push(sp(pad('─'.repeat(w),k).replace(/─ (?=─)/g,'──'),e+2));L.push(sp(pad(String(k<D?rm*10:rm),k<D?k+1:k),e+2));
nt(e+2,`<b>${c()}</b> Kurangkan: ${cur} − ${pr} = ${rm}. ${k<D?'Turunkan 0 → '+rm*10+'.':'Sisa '+rm+', pembagian selesai.'}`);r=rm;e+=3}
nt(e,`<b>${c()}</b> Hasil: ${a} : ${b} = <b>0,${dg}</b>`);
return `<div class=ldw><div class=ld><div class=qq>${qh}</div><div class=dvs>${sp(b,0)}</div><div class=dn><pre>${sp(a+','+'0'.repeat(D),0)}\n${L.join('\n')}</pre></div></div><div class=nts>${N.join('')}</div></div>`}
